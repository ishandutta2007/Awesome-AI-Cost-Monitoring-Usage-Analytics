<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="chart-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.4)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.0)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-orb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .gradient-title {
        fill: url(#primary-glow);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
      }
      .metric-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        fill: #64748b;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 20px;
        fill: #38bdf8;
      }

      /* Dynamic pulse and floating animations */
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
      }
      @keyframes pulseOrb2 {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.6; }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pingDot {
        0% { r: 3px; opacity: 1; }
        100% { r: 9px; opacity: 0; }
      }

      .orb-1 {
        transform-origin: 200px 100px;
        animation: pulseOrb 8s ease-in-out infinite;
      }
      .orb-2 {
        transform-origin: 950px 300px;
        animation: pulseOrb2 9s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 8 6;
        animation: dashStream 4s linear infinite;
      }
      .stream-line-fast {
        stroke-dasharray: 6 4;
        animation: dashStream 2s linear infinite;
      }
      .floating-widget {
        animation: floatCard 6s ease-in-out infinite;
      }
      .radar-pulse {
        animation: pingDot 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Background Dynamic Ambient Glowing Orbs (Behind content) -->
  <g>
    <circle class="orb-1" cx="220" cy="110" r="160" fill="#6366f1" filter="url(#blur-orb)" />
    <circle class="orb-2" cx="960" cy="280" r="170" fill="#ec4899" filter="url(#blur-orb)" />
    <circle cx="650" cy="360" r="130" fill="#06b6d4" opacity="0.2" filter="url(#blur-orb)" />
  </g>

  <!-- Animated Data Streams in Background (Lower opacity, will not obstruct text) -->
  <g opacity="0.35">
    <path class="stream-line" d="M -50 80 Q 250 140 550 70 T 1250 110" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="stream-line-fast" d="M -50 340 Q 350 260 700 330 T 1250 290" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="stream-line" d="M 800 -20 Q 900 180 1150 440" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Right-side Decorative Dashboard Graphic (FinOps Visualizer) -->
  <g class="floating-widget" transform="translate(810, 55)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="330" height="300" rx="16" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    
    <!-- Card Header -->
    <circle cx="28" cy="30" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="44" cy="30" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="30" r="5" fill="#10b981" opacity="0.8" />
    <text x="82" y="34" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b">LIVE AI FINOPS TELEMETRY</text>

    <!-- Mini Telemetry Pill 1 -->
    <g transform="translate(24, 55)">
      <rect width="134" height="60" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
      <text x="14" y="22" class="metric-label">Token Burn</text>
      <text x="14" y="47" class="metric-val">4.2M<tspan font-size="12" fill="#64748b">/hr</tspan></text>
    </g>

    <!-- Mini Telemetry Pill 2 -->
    <g transform="translate(172, 55)">
      <rect width="134" height="60" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="14" y="22" class="metric-label">Cache Hit Rate</text>
      <text x="14" y="47" class="metric-val" fill="#34d399">78.4%</text>
    </g>

    <!-- Mini Sparkline Area Chart -->
    <g transform="translate(24, 130)">
      <rect width="282" height="100" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <path d="M 15 80 L 50 65 L 90 72 L 130 45 L 170 52 L 210 28 L 250 35 L 267 18 L 267 85 L 15 85 Z" fill="url(#chart-area)" />
      <path d="M 15 80 L 50 65 L 90 72 L 130 45 L 170 52 L 210 28 L 250 35 L 267 18" fill="none" stroke="#6366f1" stroke-width="2.5" />
      
      <!-- Live glowing radar ping point -->
      <circle cx="267" cy="18" r="4" fill="#38bdf8" />
      <circle class="radar-pulse" cx="267" cy="18" r="4" fill="none" stroke="#38bdf8" stroke-width="2" />
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(24, 245)">
      <rect width="282" height="38" rx="8" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1" />
      <circle cx="16" cy="19" r="4" fill="#10b981" />
      <text x="28" y="23" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">Gateway Budget Quotas Active</text>
      <text x="230" y="23" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">-42% Cost</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed High Contrast & Legibility -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="265" height="30" rx="15" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#38bdf8" />
      <text x="27" y="19" class="pill-text" fill="#a5b4fc" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title Lines (Always Foreground) -->
    <text x="0" y="78" class="title-text">
      AI Cost Monitoring &amp;
    </text>
    <text x="0" y="128" class="title-text gradient-title">
      Usage Analytics
    </text>

    <!-- Subtitle (Always Foreground) -->
    <text x="0" y="172" class="subtitle-text">
      Spend Governance, Token Burn Velocity &amp; FinOps Gateways
    </text>
    <text x="0" y="198" class="subtitle-text" font-size="15" fill="#64748b">
      Enterprise SaaS Platforms • Self-Hosted Proxies • Coding-Agent Monitors
    </text>

    <!-- Feature Attribute Pills (Foreground) -->
    <g transform="translate(0, 235)">
      <!-- Pill 1: Claude Code & Agents -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="21" class="pill-text">⚡ Claude Code &amp; Agents</text>
      </g>

      <!-- Pill 2: Token Analytics -->
      <g transform="translate(192, 0)">
        <rect width="168" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="21" class="pill-text">📊 Token Analytics</text>
      </g>

      <!-- Pill 3: Budget Gateways -->
      <g transform="translate(372, 0)">
        <rect width="168" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="21" class="pill-text">🛡️ FinOps Gateways</text>
      </g>

      <!-- Pill 4: Caching -->
      <g transform="translate(552, 0)">
        <rect width="140" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="21" class="pill-text">🚀 Cache Savings</text>
      </g>
    </g>
  </g>
</svg>
